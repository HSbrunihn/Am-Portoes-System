spring.application.name=AmPortoesSystem

# Servidor (o proxy do Angular aponta para 8081)
server.port=${SERVER_PORT:8081}

# PostgreSQL (a senha NÃO tem valor padrão de propósito)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/am_portoes}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}

# JWT (a chave NÃO tem valor padrão de propósito; deve ser Base64 com no mínimo 32 bytes)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# CORS: origens permitidas, separadas por vírgula (em produção, a URL do Angular)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Administrador inicial (criado só se ADMIN_PASSWORD estiver definida e o e-mail não existir)
app.admin.email=${ADMIN_EMAIL:admin@amportoes.com.br}
app.admin.password=${ADMIN_PASSWORD:}
